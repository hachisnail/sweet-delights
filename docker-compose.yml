version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ENV=development
      - DB_HOST=db
      - DB_NAME=sweet_delights
      - DB_USER=root
      - DB_PASS=secret
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8090:80"
    depends_on:
      - app

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    ports:
      - "3310:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=sweet_delights
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
